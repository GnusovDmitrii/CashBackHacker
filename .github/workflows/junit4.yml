name: JUnit4 Tests

on:
  push:
    branches: [ junit4 ]
  pull_request:
    branches: [ junit4 ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: junit4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run JUnit4 tests
        run: ./gradlew clean test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit4-test-report
          path: build/reports/tests/test/

      - name: Check test results
        if: always()
        run: |
          if [ -f build/reports/tests/test/index.html ]; then
            echo "📊 Test report found"
            if grep -q "failures=\"0\"" build/reports/tests/test/index.html; then
              echo "❌ ERROR: All tests passed - bug was not detected!"
              exit 1
            else
              echo "✅ SUCCESS: Bug detected - tests failed as expected"
              exit 0
            fi
          else
            echo "❌ ERROR: Test report not found"
            exit 1
          fi
